<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mưa Từ Vựng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12282d;
    --ink-deep: #0a1b1f;
    --chalk: #f4efe2;
    --chalk-dim: #aebcb6;
    --sun: #ffd166;
    --mint: #7fe0b8;
    --coral: #ff7b6b;
    --wood: #e8c39a;
    --line: rgba(244, 239, 226, 0.16);
    --font-display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
    --font-body: "Be Vietnam Pro", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; box-sizing: border-box; }
  body {
    background: var(--ink-deep);
    color: var(--chalk);
    font: 14px/1.5 var(--font-body);
    margin: 0;
  }
  .app {
    box-sizing: border-box;
    height: 100%;
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .hud { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; gap: 3px; line-height: 1; min-width: 0; }
  .stat span { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--chalk-dim); }
  .stat b { font-family: var(--font-display); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .stat b.done { color: var(--mint); }
  .right { display: flex; align-items: center; gap: 10px; margin-left: auto; }

  .btn {
    font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1;
    color: var(--chalk); background: transparent; border: 1.5px solid var(--line);
    border-radius: 12px; padding: 12px 20px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--chalk-dim); }
  .btn:focus-visible, .chip:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--sun); border-color: var(--sun); color: var(--ink-deep); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.small { font-size: 14px; padding: 8px 12px; border-radius: 10px; font-family: var(--font-body); font-weight: 600; }

  .stage {
    position: relative; flex: 1; min-height: 320px; overflow: hidden;
    border-radius: 16px; background: var(--ink); box-shadow: inset 0 0 0 1px var(--line);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
    background: rgba(10, 27, 31, 0.74); overflow-y: auto;
  }
  .overlay[hidden] { display: none; }
  .panel {
    width: 100%; max-width: 430px; box-sizing: border-box; padding: 22px;
    background: var(--ink); border: 1px solid var(--line); border-radius: 16px;
    display: flex; flex-direction: column; gap: 14px; min-width: 0;
  }
  .eyebrow { margin: 0; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mint); }
  h1, h2 { margin: 0; font-family: var(--font-display); font-weight: 800; line-height: 1.05; text-wrap: balance; }
  h1 { font-size: 44px; color: var(--sun); }
  h2 { font-size: 34px; color: var(--sun); }
  h3 { margin: 0; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--chalk-dim); font-weight: 600; }
  .lead { margin: 0; color: var(--chalk); }
  .how { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--chalk-dim); font-size: 13px; }
  .topics { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: 500 14px var(--font-body); color: var(--chalk); background: transparent;
    border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer;
  }
  .chip[aria-checked="true"] { background: var(--chalk); color: var(--ink-deep); border-color: var(--chalk); font-weight: 600; }
  .best { margin: 0; color: var(--chalk-dim); font-size: 13px; }
  .best b { color: var(--sun); font-variant-numeric: tabular-nums; }
  .result { display: flex; gap: 22px; flex-wrap: wrap; }
  .result div { display: flex; flex-direction: column; gap: 2px; }
  .result span { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--chalk-dim); }
  .result b { font-family: var(--font-display); font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .review { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  .review li { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .review b { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--chalk); overflow-wrap: anywhere; }
  .review span { color: var(--sun); font-size: 13px; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  @media (max-width: 440px) {
    h1 { font-size: 38px; }
    .panel { padding: 18px; }
    .review { grid-template-columns: 1fr; }
  }
</style>

</head>
<body>
<div class="app">
  <header class="hud">
    <div class="stats">
      <div class="stat"><span>Điểm</span><b id="score">0</b></div>
      <div class="stat"><span>Cấp</span><b id="level">1</b></div>
      <div class="stat"><span>Combo</span><b id="combo">×1</b></div>
      <div class="stat"><span>Còn</span><b id="left">0</b></div>
      <div class="stat"><span>Sai</span><b id="wrong">0</b></div>
    </div>
    <div class="right">
      <button class="btn small" id="pause" type="button" disabled>Tạm dừng</button>
      <button class="btn small" id="mute" type="button">Âm: Bật</button>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Màn chơi Mưa Từ Vựng"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>
</div>

  // Places a word in the first of up to 3 vertical bands that has a comfortable
  // horizontal slot. A word only needs to clear neighbours in its own band, so
  // crowded tops cascade upward instead of overlapping.
  function spawnWord(e, force) {
    var fs = fontSize();
    ctx.font = '600 ' + fs + 'px ' + FD;
    var tw = ctx.measureText(e[0]).width;
    var maxW = Math.max(90, W - 28);
    var wfs = fs;
    if (tw + 30 > maxW) {
      wfs = Math.max(11, Math.floor(fs * (maxW - 30) / Math.max(1, tw)));
      ctx.font = '600 ' + wfs + 'px ' + FD;
      tw = ctx.measureText(e[0]).width;

    var w = Math.ceil(tw) + 30, h = Math.max(26, wfs + 16);
    var padX = 14, gapX = 64, bandPad = 64;   // min clear space between any two words (sideways or vertically)

        var o = words[k];
        if (Math.abs(o.y - newY) < (o.h + h) / 2 + bandPad) neighbors.push(o);
      }
      var cx, clear;
      if (right <= left) { cx = W / 2; clear = Infinity; }
      else if (!neighbors.length) { cx = left + Math.random() * (right - left); clear = Infinity; }
      else {
        clear = -Infinity; cx = (left + right) / 2;
        for (var t = 0; t < 80; t++) {
          var cand = left + Math.random() * (right - left);
          var c2 = Infinity;
          for (var j = 0; j < neighbors.length; j++) {
            var o2 = neighbors[j];
            var need = (o2.w + w) / 2 + gapX;
            var c = Math.abs(o2.x0 - cand) - need;
            if (c < c2) c2 = c;
          }
          if (c2 > clear) { clear = c2; cx = cand; }

        }
      }
      if (clear > bestClear) { bestClear = clear; bestY = newY; bestX = cx; }
      if (clear >= 0) break;
    }

    if (bestClear < 0 && !force) return false;
    words.push({
      e: e, x0: bestX, x: bestX, y: bestY, w: w, h: h, fs: wfs,
      vy: speedBase() * rand(0.96, 1.04), ph: Math.random() * 6.28

  }

    if (muzzle > 0) muzzle = Math.max(0, muzzle - dt * 9);

    if (state === 'play') {
      aim = Math.max(-LIM, Math.min(LIM, aim + ((keys.r ? 1 : 0) - (keys.l ? 1 : 0)) * 2.2 * dt));
      manageSpawns();
    } else {
      demoT -= dt;
      if (demoT <= 0) {
        if (words.length < 5) {
          var de = pickEntry(ALL);
          if (de && spawnWord(de, false)) demoT = 1.0;
          else demoT = 0.5;
        } else demoT = 0.8;
      }
    }

    for (var i = words.length - 1; i >= 0; i--) {
      var wd = words[i];
      wd.vy = speedBase();   // all words share one speed so gaps never close
      wd.y += wd.vy * dt;
      wd.x = wd.x0 + (reduce ? 0 : Math.sin(clock * 1.3 + wd.ph) * 3);
      wd.x = Math.max(wd.w / 2 + 4, Math.min(W - wd.w / 2 - 4, wd.x));
      if (wd.y + wd.h / 2 >= pivot.y) {
        words.splice(i, 1);
        if (state === 'play' && wd.e === target) landed(wd);
        else if (state === 'play') burst(wd.x, pivot.y - 6, COL['chalk-dim'], 5);
      }
    }

    for (var b = bullets.length - 1; b >= 0; b--) {
      var bl = bullets[b], dead = false;
      var dist = bl.speed * dt, steps = Math.max(1, Math.ceil(dist / 10)), sd = dist / steps;
      for (var s = 0; s < steps && !dead; s++) {
        bl.x += bl.dx * sd; bl.y += bl.dy * sd;
        if (bl.x < -20 || bl.x > W + 20 || bl.y < -30) { dead = true; break; }
        for (var j = 0; j < words.length; j++) {
          var o = words[j];
          if (Math.abs(bl.x - o.x) < o.w / 2 + 4 && Math.abs(bl.y - o.y) < o.h / 2 + 4) { dead = true; hit(o); break; }
        }
        if (state !== 'play') dead = true;
      }
      if (dead) bullets.splice(b, 1);
    }

    for (var p = parts.length - 1; p >= 0; p--) {
      var pt = parts[p];
      pt.life -= dt; pt.vy += (pt.gr === undefined ? 520 : pt.gr) * dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      if (pt.life <= 0) parts.splice(p, 1);
    }
    for (var f = floats.length - 1; f >= 0; f--) {
      floats[f].life -= dt; floats[f].y -= 28 * dt;
      if (floats[f].life <= 0) floats.splice(f, 1);
    }
  }

  /* ---------- Draw ---------- */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCannon(playing) {
    var a = playing ? aim : Math.sin(clock * 1.1) * 0.18;
    var kick = recoil * 14;
    var cy = pivot.y - 20;               // turret centre
    var pulse = reduce ? 0.5 : 0.5 + 0.5 * Math.sin(clock * 3);

    // Scale everything about the pivot so the blaster stays anchored but smaller.
    ctx.save();
    ctx.translate(pivot.x, pivot.y);
    ctx.scale(GUN_SCALE, GUN_SCALE);
    ctx.translate(-pivot.x, -pivot.y);

    // ground shadow
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(pivot.x, pivot.y + 3, 62, 9, 0, 0, 6.283); ctx.fill();
    ctx.restore();

    // base plate
    var bgd = ctx.createLinearGradient(0, pivot.y - 22, 0, pivot.y);
    bgd.addColorStop(0, '#cfd9d3');
    bgd.addColorStop(0.5, '#8fa39b');
    bgd.addColorStop(1, '#4f635c');
    ctx.fillStyle = bgd;
    ctx.beginPath();
    ctx.moveTo(pivot.x - 60, pivot.y);
    ctx.lineTo(pivot.x - 46, pivot.y - 20);
    ctx.lineTo(pivot.x + 46, pivot.y - 20);
    ctx.lineTo(pivot.x + 60, pivot.y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = COL.coral;
    ctx.beginPath();
    ctx.moveTo(pivot.x - 55, pivot.y - 7);
    ctx.lineTo(pivot.x - 51, pivot.y - 13);
    ctx.lineTo(pivot.x + 51, pivot.y - 13);
    ctx.lineTo(pivot.x + 55, pivot.y - 7);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    rr(pivot.x - 44, pivot.y - 19, 88, 2.5, 1.2); ctx.fill();
    // side lights
    for (var sd = -1; sd <= 1; sd += 2) {
      ctx.fillStyle = COL.mint; ctx.globalAlpha = 0.55 + 0.45 * pulse;
      ctx.beginPath(); ctx.arc(pivot.x + sd * 36, pivot.y - 5, 2.6, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // turret ring + dome
    var ring = ctx.createLinearGradient(0, cy - 30, 0, cy + 14);
    ring.addColorStop(0, '#e9efe9');
    ring.addColorStop(1, '#5d726a');
    ctx.fillStyle = ring;
    ctx.beginPath(); ctx.arc(pivot.x, cy, 30, Math.PI, 0); ctx.closePath(); ctx.fill();
    var dome = ctx.createRadialGradient(pivot.x - 8, cy - 14, 2, pivot.x, cy - 4, 26);
    dome.addColorStop(0, '#2c4a50');
    dome.addColorStop(1, '#0f2327');
    ctx.fillStyle = dome;
    ctx.beginPath(); ctx.arc(pivot.x, cy, 23, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = COL.sun; ctx.lineWidth = 2;
    ctx.globalAlpha = 0.7 + 0.3 * pulse;
    ctx.beginPath(); ctx.arc(pivot.x, cy, 26.5, Math.PI * 1.04, Math.PI * 1.96); ctx.stroke();
    ctx.globalAlpha = 1;
    // glossy highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(pivot.x, cy, 17, Math.PI * 1.12, Math.PI * 1.45); ctx.stroke();
    ctx.lineCap = 'butt';

    // barrel (rotates with aim, kicks back on fire)
    ctx.save();
    ctx.translate(pivot.x, cy);
    ctx.rotate(a);
    ctx.translate(0, kick);

    // rear collar
    var cg = ctx.createLinearGradient(-15, 0, 15, 0);
    cg.addColorStop(0, '#3d544f'); cg.addColorStop(0.5, '#a9bcb4'); cg.addColorStop(1, '#3d544f');
    ctx.fillStyle = cg; rr(-15, -16, 30, 14, 4); ctx.fill();

    // main tube
    var tg = ctx.createLinearGradient(-11, 0, 11, 0);
    tg.addColorStop(0, '#1b3a40');
    tg.addColorStop(0.28, '#4f8b92');
    tg.addColorStop(0.5, '#b9ece3');
    tg.addColorStop(0.72, '#3f7a82');
    tg.addColorStop(1, '#12292e');
    ctx.fillStyle = tg; rr(-11, -66, 22, 54, 4); ctx.fill();

    // glowing energy coils
    var glow = 0.45 + 0.4 * pulse + 0.5 * muzzle;
    ctx.fillStyle = 'rgba(127,224,184,' + Math.min(1, glow) + ')';
    for (var cI = 0; cI < 3; cI++) rr(-11, -58 + cI * 15, 22, 3.2, 1.6), ctx.fill();

    // sun rings
    var rg = ctx.createLinearGradient(-14, 0, 14, 0);
    rg.addColorStop(0, '#b3811f'); rg.addColorStop(0.5, '#fff1c7'); rg.addColorStop(1, '#b3811f');
    ctx.fillStyle = rg;
    rr(-14, -30, 28, 5, 2); ctx.fill();
    rr(-14, -64, 28, 5, 2); ctx.fill();

    // muzzle housing
    var mg = ctx.createLinearGradient(-15, 0, 15, 0);
    mg.addColorStop(0, '#b73e34'); mg.addColorStop(0.45, '#ff9a8c'); mg.addColorStop(1, '#b73e34');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.moveTo(-12, -68); ctx.lineTo(12, -68); ctx.lineTo(16, -80); ctx.lineTo(-16, -80);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0a1b1f';
    rr(-8, -84, 16, 6, 3); ctx.fill();

    // tip orb + muzzle flash (barrel space, follows aim)
    var tx = 0, ty = -86;
    var glowR = Math.max(4, 8 + pulse * 2 + 18 * muzzle);
    var gg = ctx.createRadialGradient(tx, ty, 0, tx, ty, glowR);
    gg.addColorStop(0, 'rgba(255,251,236,' + (0.9 + 0.1 * muzzle) + ')');
    gg.addColorStop(0.4, 'rgba(255,209,102,' + (0.6 + 0.4 * muzzle) + ')');
    gg.addColorStop(1, 'rgba(127,224,184,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(tx, ty, glowR, 0, 6.283); ctx.fill();

    if (muzzle > 0.02) {
      ctx.save();
      ctx.translate(tx, ty);
      ctx.globalAlpha = muzzle;
      ctx.fillStyle = COL.sun;
      for (var k = 0; k < 8; k++) {
        var ang = -Math.PI / 2 + (k - 3.5) * 0.36;
        var len = (26 + 14 * (k % 2)) * muzzle;
        ctx.save(); ctx.rotate(ang + Math.PI / 2);
        ctx.beginPath(); ctx.moveTo(-3, -4); ctx.lineTo(0, -len); ctx.lineTo(3, -4); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = 'rgba(255,251,236,0.95)';
      ctx.beginPath(); ctx.arc(0, 0, 5 + 5 * muzzle, 0, 6.283); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    ctx.restore(); // barrel
    ctx.restore(); // scale
  }

  function draw() {
    ctx.save();
    ctx.fillStyle = COL.ink; ctx.fillRect(0, 0, W, H);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    ctx.lineWidth = 1; ctx.strokeStyle = COL.chalk; ctx.globalAlpha = 0.06;
    var off = reduce ? 0 : (clock * 14) % 38;
    for (var y = off - 38; y < H; y += 38) { ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke(); }
    ctx.globalAlpha = 0.14; ctx.strokeStyle = COL.coral;
    ctx.beginPath(); ctx.moveTo(34.5, 0); ctx.lineTo(34.5, H); ctx.stroke();
    ctx.globalAlpha = 1;

    var vg = ctx.createRadialGradient(W / 2, H * 0.42, Math.min(W, H) * 0.18, W / 2, H * 0.42, Math.max(W, H) * 0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.30)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = COL['ink-deep']; ctx.fillRect(-12, pivot.y, W + 24, BAR + 12);
    ctx.strokeStyle = COL.coral; ctx.globalAlpha = 0.6; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.moveTo(0, pivot.y); ctx.lineTo(W, pivot.y); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;

    var fs = fontSize();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = (state === 'play' || state === 'pause') ? 1 : 0.5;
    for (var i = 0; i < words.length; i++) {
      var wd = words[i], x = wd.x - wd.w / 2, yy = wd.y - wd.h / 2;
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(x, yy + 4, wd.w, wd.h, 11); ctx.fill();
      ctx.fillStyle = COL.chalk; rr(x, yy, wd.w, wd.h, 11); ctx.fill();
      ctx.fillStyle = COL['ink-deep']; ctx.font = '600 ' + (wd.fs || fs) + 'px ' + FD;
      ctx.fillText(wd.e[0], wd.x, wd.y + 2);
    }
    ctx.globalAlpha = 1;

    var playing = state === 'play' || state === 'pause';
    if (state === 'play') {
      var gx = Math.sin(aim), gy = -Math.cos(aim);
      var t0 = tipPos(aim, false);
      ctx.strokeStyle = COL.sun; ctx.globalAlpha = 0.45; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.setLineDash([2, 10]);
      ctx.beginPath();
      ctx.moveTo(t0.x + gx * 12, t0.y + gy * 12);
      ctx.lineTo(t0.x + gx * 180, t0.y + gy * 180);
      ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.arc(t0.x + gx * 186, t0.y + gy * 186, 7, 0, 6.283); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineCap = 'butt';
    }
    drawCannon(playing);

    for (var b = 0; b < bullets.length; b++) {
      var bl = bullets[b];
      var ang = Math.atan2(bl.dy, bl.dx);
      ctx.save();
      ctx.translate(bl.x, bl.y);
      ctx.rotate(ang);

      // comet tail
      var tl = ctx.createLinearGradient(0, 0, -110, 0);
      tl.addColorStop(0, 'rgba(255,209,102,0.85)');
      tl.addColorStop(0.5, 'rgba(127,224,184,0.35)');
      tl.addColorStop(1, 'rgba(127,224,184,0)');
      ctx.fillStyle = tl;
      ctx.beginPath(); ctx.moveTo(0, -8); ctx.quadraticCurveTo(-60, -3, -110, 0); ctx.quadraticCurveTo(-60, 3, 0, 8); ctx.closePath(); ctx.fill();
      var tl2 = ctx.createLinearGradient(0, 0, -70, 0);
      tl2.addColorStop(0, 'rgba(255,251,236,0.95)');
      tl2.addColorStop(1, 'rgba(255,251,236,0)');
      ctx.fillStyle = tl2;
      ctx.beginPath(); ctx.moveTo(0, -3.5); ctx.lineTo(-70, 0); ctx.lineTo(0, 3.5); ctx.closePath(); ctx.fill();

      // trailing sparkles
      for (var sp = 1; sp <= 4; sp++) {
        var sx = -sp * 20 - 6, sy = Math.sin(clock * 14 + sp * 1.7) * (3 + sp);
        ctx.globalAlpha = 0.8 - sp * 0.17;
        ctx.fillStyle = sp % 2 ? COL.mint : COL.sun;
        ctx.beginPath(); ctx.arc(sx, sy, 2.4 - sp * 0.35, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // halo
      var hg = ctx.createRadialGradient(0, 0, 0, 0, 0, 22);
      hg.addColorStop(0, 'rgba(255,251,236,0.95)');
      hg.addColorStop(0.3, 'rgba(255,209,102,0.7)');
      hg.addColorStop(1, 'rgba(255,209,102,0)');
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, 6.283); ctx.fill();

      // spinning star core
      ctx.save();
      ctx.rotate(clock * 8);
      ctx.fillStyle = COL.sun;
      ctx.beginPath();
      for (var pt2 = 0; pt2 < 8; pt2++) {
        var rad = pt2 % 2 ? 4.5 : 10, pa = pt2 * Math.PI / 4;
        ctx.lineTo(Math.cos(pa) * rad, Math.sin(pa) * rad);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#fffbe8';
      ctx.beginPath(); ctx.arc(0, 0, 3.6, 0, 6.283); ctx.fill();
      ctx.restore();
    }

    for (var p = 0; p < parts.length; p++) {
      var pt = parts[p];
      ctx.globalAlpha = Math.max(0, pt.life / pt.max); ctx.fillStyle = pt.c;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = COL['chalk-dim']; ctx.font = '600 10px ' + FB;
    try { ctx.letterSpacing = '2px'; } catch (e) {}
    ctx.fillText('NGHĨA TIẾNG VIỆT', W / 2, pivot.y + 20);
    try { ctx.letterSpacing = '0px'; } catch (e) {}
    var vi = (playing && target) ? target[1] : 'Sẵn sàng?';
    var size = Math.min(38, BAR * 0.44) * (1 + 0.22 * pop);
    ctx.font = '800 ' + size + 'px ' + FD;
    var tw = ctx.measureText(vi).width;
    if (tw > W - 40) { size = size * (W - 40) / tw; ctx.font = '800 ' + size + 'px ' + FD; }
    ctx.fillStyle = COL.sun; ctx.fillText(vi, W / 2, H - 15);

    ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    for (var q = 0; q < floats.length; q++) {
      var ft = floats[q];
      ctx.globalAlpha = Math.min(1, ft.life / 0.5);
      ctx.font = '800 ' + ft.size + 'px ' + FD;
      var w2 = ctx.measureText(ft.text).width;
      var fx = Math.max(w2 / 2 + 8, Math.min(W - w2 / 2 - 8, ft.x));
      ctx.lineWidth = 5; ctx.strokeStyle = COL['ink-deep']; ctx.strokeText(ft.text, fx, ft.y);
      ctx.fillStyle = ft.color; ctx.fillText(ft.text, fx, ft.y);
    }
    ctx.globalAlpha = 1;

    if (flash > 0) { ctx.fillStyle = COL.coral; ctx.globalAlpha = flash * 0.4; ctx.fillRect(-20, -20, W + 40, H + 40); ctx.globalAlpha = 1; }
    ctx.restore();
  }

  /* ---------- Overlays ---------- */
  function setOverlay(html) {
    overlay.innerHTML = html; overlay.hidden = false; overlay.scrollTop = 0;
    var primary = overlay.querySelector('.primary');
    if (primary) primary.focus({ preventScroll: true });
  }
  function showMenu() {
    state = 'menu'; demoT = 0;
    remaining = poolFor(topicKey).slice();
    hud();
    var chips = Object.keys(TOPICS).map(function (k) {
      return '<button type="button" class="chip" role="radio" aria-checked="' + (k === topicKey) + '" data-topic="' + k + '">' + TOPICS[k].name + '</button>';
    }).join('');
    setOverlay(
      '<div class="panel">' +
      '<p class="eyebrow">Học từ vựng tiếng Anh</p>' +
      '<h1>Mưa Từ Vựng</h1>' +
      '<p class="lead">Nghĩa tiếng Việt hiện ở đáy màn hình. Hãy bắn trúng từ tiếng Anh đang rơi có nghĩa đó. Trả lời đúng hết các từ để hoàn thành chủ đề.</p>' +
      '<div class="topics" role="radiogroup" aria-label="Chủ đề">' + chips + '</div>' +
      '<ul class="how">' +
      '<li>Rê chuột hoặc chạm để ngắm, nhấp hoặc chạm để bắn. Bàn phím: ← → để ngắm, Space để bắn.</li>' +
      '<li>Luôn có tối đa 3 cụm từ rơi cùng lúc, được xếp tầng để không chồng lên nhau. Bắn nhầm hoặc để từ đúng chạm đáy chỉ bị tính là sai (từ đó sẽ rơi lại) — không giới hạn số lần sai.</li>' +
      '<li>Chơi đến khi trả lời đúng hết các từ của chủ đề. Trả lời đúng liên tiếp để nhân điểm (tối đa ×5). Không giới hạn thời gian — cứ thong thả mà ngắm.</li></ul>' +
      '<div class="actions"><button type="button" class="btn primary" id="go">Bắt đầu chơi</button></div>' +
      '<p class="best">Điểm cao nhất: <b>' + best + '</b></p>' +
      '</div>');
  }
  function showPause() {
    setOverlay(
      '<div class="panel"><h2>Tạm dừng</h2>' +
      '<p class="best">Còn <b>' + remaining.length + '</b> từ chưa trả lời đúng · Sai <b>' + wrongCount + '</b> lần.</p>' +
      '<div class="actions"><button type="button" class="btn primary" id="resume">Tiếp tục</button>' +
      '<button type="button" class="btn" id="menu">Về menu</button></div></div>');
  }
  function showResult(isNew) {
    var list = Array.from(missed.values()).slice(0, 12);
    var review = list.length
      ? '<h3>Từ cần ôn</h3><ul class="review">' + list.map(function (e) { return '<li><b>' + e[0] + '</b><span>' + e[1] + '</span></li>'; }).join('') + '</ul>'
      : '';
    setOverlay(
      '<div class="panel">' +
      '<p class="eyebrow">Đã học hết từ vựng</p>' +
      '<h2>Hoàn thành!</h2>' +
      '<p class="lead">Bạn đã trả lời đúng cả ' + pool.length + ' từ của chủ đề này.</p>' +
      '<div class="result">' +
      '<div><span>Điểm</span><b>' + score + '</b></div>' +
      '<div><span>Cấp</span><b>' + level + '</b></div>' +
      '<div><span>Từ đúng</span><b>' + correctCount + '</b></div>' +
      '<div><span>Sai</span><b>' + wrongCount + '</b></div>' +
      '</div>' +
      '<p class="best">' + (isNew ? 'Kỷ lục mới! ' : '') + 'Điểm cao nhất: <b>' + best + '</b></p>' +
      review +
      '<div class="actions"><button type="button" class="btn primary" id="again">Chơi lại</button>' +
      '<button type="button" class="btn" id="menu">Đổi chủ đề</button></div>' +
      '</div>');
  }

  overlay.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.topic) {
      topicKey = t.dataset.topic;
      overlay.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-checked', String(c === t)); });
      remaining = poolFor(topicKey).slice();
      hud();
    } else if (t.id === 'go' || t.id === 'again') startGame();
    else if (t.id === 'resume') resume();
    else if (t.id === 'menu') { words = []; showMenu(); }
  });
  btnPause.addEventListener('click', function () { if (state === 'play') pause(); else if (state === 'pause') resume(); });
  btnMute.addEventListener('click', function () { toggleMute(); btnMute.blur(); });

  /* ---------- Input ---------- */
  function pointerPos(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  canvas.addEventListener('pointermove', function (e) { if (state === 'play') aimAt(pointerPos(e)); });
  canvas.addEventListener('pointerdown', function (e) {
    if (state !== 'play') return;
    e.preventDefault(); aimAt(pointerPos(e)); fire();
  });
  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'm' || k === 'M') { toggleMute(); return; }
    if (k === 'p' || k === 'P' || k === 'Escape') {
      if (state === 'play') { pause(); e.preventDefault(); } else if (state === 'pause') { resume(); e.preventDefault(); }
      return;
    }
    if (state !== 'play') return;
    if (k === ' ' || k === 'ArrowUp') { e.preventDefault(); fire(); }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); keys.l = true; }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); keys.r = true; }
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false;
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });

  /* ---------- Loop ---------- */
  var last = 0;
  function frame(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0);
    last = ts;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
